[package]
name = "tax"
version = "0.0.8"
authors = ["Jerome Schneider <mail@jeromeschneider.f>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "tax is a cli task list manager"
homepage = "https://github.com/netgusto/tax"
repository = "https://github.com/netgusto/tax"
readme = "README.md"
keywords = ["task", "markdown", "orgmode", "cli", "todo"]
categories = ["command-line-utilities"]

[dependencies]
regex = "1"
dirs = "6"
which = "7"
colored = "2"
clap = { version = "4", features = ["derive"] }
